name: Validate mutest-swift Xcode workers

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Sequential benchmark runs for each worker count
        type: choice
        options: ["3", "1", "0"]
        default: "3"
      skip_fixtures:
        description: Run only the app benchmark
        type: boolean
        default: false
      extra_fixtures_only:
        description: Run only isolated-build and schema-narrowing checks
        type: boolean
        default: false
      test_tool:
        description: Run the library unit and Swift package integration tests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mutest-xcode-worker-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Xcode worker acceptance and benchmarks
    runs-on: [self-hosted, macos]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-xcode
      - uses: jamilkhan55/mutest-swift/.github/actions/validate-xcode-workers@main
        with:
          destination: ${{ env.IOS_DESTINATION }}
          repetitions: ${{ inputs.repetitions }}
          skip-fixtures: ${{ inputs.skip_fixtures }}
          extra-fixtures-only: ${{ inputs.extra_fixtures_only }}
          test-tool: ${{ inputs.test_tool }}
