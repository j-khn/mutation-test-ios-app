name: Swift CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      mutation_scope:
        description: Mutation scope for a manually started run
        type: choice
        options: [diff, full]
        default: diff
      mutest_cache:
        description: Reuse previous mutest-swift verdicts (disable for a clean speed benchmark)
        type: boolean
        default: true
      mutest_base_sha:
        description: Optional base commit for the mutest-swift changed-source run
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode toolchain
        run: |
          set -euo pipefail
          echo "Developer directory: $(xcode-select -p)"
          xcodebuild -version
          echo "Swift version:"
          swift --version
      - name: Build
        run: swift build -v
      - name: Unit tests
        run: swift test -v

  mutation-testing:
    name: Mutation testing
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install swift-mutation-testing
        run: |
          set -euo pipefail
          brew tap ericodx/homebrew-tools
          brew install swift-mutation-testing
          echo "Mutation tool: $(command -v swift-mutation-testing)"
      - name: Run mutation analysis on changed Swift files
        if: github.event_name != 'workflow_dispatch' || inputs.mutation_scope != 'full'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p mutation-reports
          base_sha="$BEFORE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi

          git diff --name-only --diff-filter=ACMRT "$base_sha" "$GITHUB_SHA" -- Sources/CheckoutDomain \
            | awk '/\.swift$/' > mutation-reports/changed-source-files.txt

          if [[ ! -s mutation-reports/changed-source-files.txt ]]; then
            echo "No changed domain Swift files; mutation analysis skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          while IFS= read -r source_file; do
            report_id="$(printf '%s' "$source_file" | shasum -a 256 | cut -c1-12)"
            echo "Running mutation analysis for $source_file"
            swift-mutation-testing . \
              --sources-path "$source_file" \
              --output "mutation-reports/$report_id.json" \
              --markdown-output "mutation-reports/$report_id.md"
          done < mutation-reports/changed-source-files.txt

      - name: Run full mutation analysis
        if: github.event_name == 'workflow_dispatch' && inputs.mutation_scope == 'full'
        run: |
          set -euo pipefail
          mkdir -p mutation-reports
          swift-mutation-testing . \
            --sources-path Sources/CheckoutDomain \
            --output mutation-reports/full.json \
            --markdown-output mutation-reports/full.md

      - name: Export mutation summaries
        if: always()
        run: |
          set -euo pipefail
          if compgen -G "mutation-reports/*.md" > /dev/null; then
            for report in mutation-reports/*.md; do
              cat "$report" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "Mutation summary was not produced." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: mutation-reports/
          if-no-files-found: warn

  mutation-testing-using-mutest-swift:
    name: Mutation testing with mutest-swift
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode toolchain
        run: |
          set -euo pipefail
          echo "Developer directory: $(xcode-select -p)"
          xcodebuild -version
          echo "Swift version:"
          swift --version
          toolchain_fingerprint="$( { xcode-select -p; xcodebuild -version; swift --version; } | shasum -a 256 | awk '{print $1}')"
          echo "MUTEST_TOOLCHAIN_FINGERPRINT=$toolchain_fingerprint" >> "$GITHUB_ENV"
      - name: Restore mutest-swift verdict cache
        if: github.event_name != 'workflow_dispatch' || inputs.mutest_cache
        uses: actions/cache@v4
        with:
          path: .mutest-swift-cache
          key: mutest-swift-v2-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            mutest-swift-v2-${{ runner.os }}-${{ github.ref_name }}-
            mutest-swift-v2-${{ runner.os }}-
      - name: Find changed domain Swift files
        id: changed_sources
        if: github.event_name != 'workflow_dispatch' || inputs.mutation_scope != 'full'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA_OVERRIDE: ${{ inputs.mutest_base_sha }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA_OVERRIDE"
          if [[ -z "$base_sha" ]]; then base_sha="$BEFORE_SHA"; fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi

          git diff --name-only --diff-filter=ACMRT "$base_sha" "$GITHUB_SHA" -- Sources/CheckoutDomain \
            | awk '/\.swift$/' > "$RUNNER_TEMP/mutest-swift-changed-sources.txt"

          if [[ ! -s "$RUNNER_TEMP/mutest-swift-changed-sources.txt" ]]; then
            echo "No changed domain Swift files; mutest-swift analysis skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "has_sources=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed source files for mutest-swift:"
          cat "$RUNNER_TEMP/mutest-swift-changed-sources.txt"
          {
            echo 'source_files<<MUTEST_SOURCES_EOF'
            cat "$RUNNER_TEMP/mutest-swift-changed-sources.txt"
            echo 'MUTEST_SOURCES_EOF'
            echo 'has_sources=true'
          } >> "$GITHUB_OUTPUT"
      - name: Run mutest-swift on changed sources and the full test target
        if: steps.changed_sources.outputs.has_sources == 'true'
        uses: jamilkhan55/mutest-swift/.github/actions/run-mutation-testing@61685715a5cb4e1cbbf89d0fe7162eb018d90f16
        with:
          project-path: .
          project-kind: swift-package
          source: ${{ steps.changed_sources.outputs.source_files }}
          operator-tier: experimental
          parallelism: "2"
          cache-path: .mutest-swift-cache
          no-cache: ${{ github.event_name == 'workflow_dispatch' && !inputs.mutest_cache }}
          maximum-integrity-warnings: "0"
          output-path: mutest-swift-reports
      - name: Run full-source mutest-swift analysis
        if: github.event_name == 'workflow_dispatch' && inputs.mutation_scope == 'full'
        uses: jamilkhan55/mutest-swift/.github/actions/run-mutation-testing@61685715a5cb4e1cbbf89d0fe7162eb018d90f16
        with:
          project-path: .
          project-kind: swift-package
          operator-tier: experimental
          parallelism: "2"
          cache-path: .mutest-swift-cache
          no-cache: ${{ github.event_name == 'workflow_dispatch' && !inputs.mutest_cache }}
          maximum-integrity-warnings: "0"
          output-path: mutest-swift-reports

  deploy:
    name: Release validation
    needs: [test, mutation-testing]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
      - name: Validate release build
        run: |
          set -euo pipefail
          swift build -c release
          echo "Release build validated; no deployment destination is configured."
