name: iOS CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mutation_scope:
        description: Mutate changed source files or all app and feature source files
        type: choice
        options: [diff, full]
        default: diff
      mutation_cache:
        description: Reuse mutation results (disable for a clean benchmark)
        type: boolean
        default: true
      base_sha:
        description: Optional base commit for changed-source analysis
        type: string
        default: ""
      source_scope:
        description: Mutate changed source files or all source files in the selected package
        type: choice
        options: [changed, all]
        default: changed
      test_scope:
        description: Run changed tests, matching tests, both, or the full test plan
        type: choice
        options: [changed-and-matching, changed, matching, all]
        default: changed-and-matching

permissions:
  contents: read

jobs:
  test:
    name: Build and test iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-xcode
      - name: Check project structure
        run: |
          python3 Scripts/generate-project.py
          git diff --exit-code -- MutationTestIOSApp.xcodeproj MutationTestIOSApp.xctestplan
      - name: Build app and all feature tests
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project MutationTestIOSApp.xcodeproj -scheme MutationTestIOSApp \
            -destination "$IOS_DESTINATION" -derivedDataPath .build-xcode \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Run all tests on iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project MutationTestIOSApp.xcodeproj -scheme MutationTestIOSApp \
            -destination "$IOS_DESTINATION" -derivedDataPath .build-xcode \
            -parallel-testing-enabled NO -resultBundlePath test-results.xcresult \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: test-results.xcresult
          if-no-files-found: warn

  mutation-testing:
    name: Mutation testing
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-xcode
      - name: Select mutation source files
        id: sources
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_OVERRIDE: ${{ inputs.base_sha }}
          SCOPE: ${{ inputs.mutation_scope || 'diff' }}
        run: |
          python3 Scripts/mutation-sources.py --scope "$SCOPE" --base "${BASE_OVERRIDE:-$BEFORE_SHA}" \
            --head "$GITHUB_SHA" --output mutation-reports/changed-source-files.txt --github-output
      - name: Install swift-mutation-testing
        if: steps.sources.outputs.has_sources == 'true'
        run: |
          set -euo pipefail
          brew tap ericodx/homebrew-tools
          brew install swift-mutation-testing
          swift-mutation-testing --version
      - name: Run mutation testing through Xcode
        if: steps.sources.outputs.has_sources == 'true'
        env:
          SCOPE: ${{ inputs.mutation_scope || 'diff' }}
          NO_CACHE: ${{ github.event_name == 'workflow_dispatch' && !inputs.mutation_cache }}
        run: |
          set -euo pipefail
          args=(. --project MutationTestIOSApp.xcodeproj --scheme MutationTestIOSApp --target MutationTestIOSAppTests
            --destination "$IOS_DESTINATION" --operator-tier experimental --concurrency 2
            --timeout 120 --build-timeout 600
            --xcodebuild-arg ARCHS=arm64 --xcodebuild-arg ONLY_ACTIVE_ARCH=YES
            --xcodebuild-arg CODE_SIGNING_ALLOWED=NO)
          [[ "$NO_CACHE" == "true" ]] && args+=(--no-cache)
          if [[ "$SCOPE" == "full" ]]; then
            swift-mutation-testing "${args[@]}" --sources-path . \
              --exclude '**/Tests/**' --exclude AppTests/ --exclude '**/Package.swift' \
              --keep-logs "$RUNNER_TEMP/swift-mutation-test-logs/full" \
              --output mutation-reports/full.json --markdown-output mutation-reports/full.md
          else
            while IFS= read -r source_file; do
              report_id="$(printf '%s' "$source_file" | shasum -a 256 | cut -c1-12)"
              echo "Mutating $source_file; running the full iOS test target."
              swift-mutation-testing "${args[@]}" --sources-path "$source_file" \
                --keep-logs "$RUNNER_TEMP/swift-mutation-test-logs/$report_id" \
                --output "mutation-reports/$report_id.json" --markdown-output "mutation-reports/$report_id.md"
            done < mutation-reports/changed-source-files.txt
          fi
      - name: Count test cases run by each mutant
        if: always() && steps.sources.outputs.has_sources == 'true'
        run: |
          trap 'rm -rf -- "$RUNNER_TEMP/swift-mutation-test-logs"' EXIT
          python3 Scripts/summarize-mutation-test-logs.py "$RUNNER_TEMP/swift-mutation-test-logs" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Export mutation summaries
        if: always()
        run: |
          shopt -s nullglob
          reports=(mutation-reports/*.md)
          if [[ ${#reports[@]} == 0 ]]; then echo "No mutation report produced." >> "$GITHUB_STEP_SUMMARY"; fi
          for report in "${reports[@]}"; do cat "$report" >> "$GITHUB_STEP_SUMMARY"; done
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: mutation-reports/
          if-no-files-found: warn

  # Run after the other mutation job so both timing measurements are not competing for runner resources.
  mutation-testing-using-mutest-swift:
    name: Mutation testing with mutest-swift
    needs: [test, mutation-testing]
    if: >-
      always() && needs.test.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-xcode
      - name: Choose the comparison base
        id: commit-range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_OVERRIDE: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          base="$BASE_OVERRIDE"
          if [[ -z "$base" && "$EVENT_NAME" == "push" ]]; then base="$BEFORE_SHA"; fi
          if [[ -z "$base" && "$EVENT_NAME" == "pull_request" ]]; then base="$PR_BASE_SHA"; fi
          if [[ -z "$base" && "$EVENT_NAME" == "schedule" ]]; then
            base="$(git rev-list --max-count=1 --before='24 hours ago' "$GITHUB_SHA" || true)"
            if [[ -z "$base" ]]; then base="$(git hash-object -t tree /dev/null)"; fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Restore mutest-swift cache
        if: github.event_name != 'workflow_dispatch' || inputs.mutation_cache
        uses: actions/cache@v4
        with:
          path: .mutest-swift-cache
          key: mutest-xcode-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            mutest-xcode-v1-${{ runner.os }}-${{ github.ref_name }}-
      - name: Run mutest-swift with commit-based scope
        uses: j-khn/mutest-swift/.github/actions/run-mutation-testing@main
        with:
          project: MutationTestIOSApp.xcodeproj
          project-kind: xcode-project
          scheme: MutationTestIOSApp
          destination-simulator: ${{ env.IOS_DESTINATION }}
          source-commit: ${{ github.sha }}
          source-base: ${{ steps.commit-range.outputs.base }}
          source-scope: ${{ inputs.source_scope }}
          test-scope: ${{ inputs.test_scope }}
          test-file-suffix: Tests.swift
          operator-tier: experimental
          workers: "2"
          build-timeout: "600"
          baseline-timeout: "300"
          mutant-timeout: "120"
          cache-path: .mutest-swift-cache
          no-cache: ${{ github.event_name == 'workflow_dispatch' && !inputs.mutation_cache }}
          no-resume: ${{ github.event_name == 'workflow_dispatch' && !inputs.mutation_cache }}
          maximum-integrity-warnings: "0"
          output-path: mutest-swift-reports
          xcodebuild-arg: |
            ARCHS=arm64
            ONLY_ACTIVE_ARCH=YES
            CODE_SIGNING_ALLOWED=NO

  deploy:
    name: Release validation
    needs: [test, mutation-testing]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-xcode
      - name: Validate iOS release build
        run: |
          set -euo pipefail
          xcodebuild build -project MutationTestIOSApp.xcodeproj -scheme MutationTestIOSApp -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .build-xcode \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
