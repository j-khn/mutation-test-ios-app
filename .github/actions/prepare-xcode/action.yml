name: Prepare Xcode
description: Select Xcode and an installed iPhone simulator
runs:
  using: composite
  steps:
    - name: Select Xcode toolchain
      shell: bash
      run: |
        set -euo pipefail
        export DEVELOPER_DIR="$(xcode-select -p)"
        test -d "$DEVELOPER_DIR" || { echo "The selected Xcode developer directory does not exist: $DEVELOPER_DIR"; exit 1; }
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
        xcodebuild -version
        swift --version
        fingerprint="$( { xcode-select -p; xcodebuild -version; swift --version; } | shasum -a 256 | awk '{print $1}')"
        echo "MUTEST_TOOLCHAIN_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
        python3 Scripts/select-simulator.py --github-env
