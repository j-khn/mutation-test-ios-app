# Xcode app mode. The root deliberately has no Package.swift.
project: MutationTestIOSApp.xcodeproj
scheme: MutationTestIOSApp
test-target: MutationTestIOSAppTests
testing-framework: swift-testing
operator-tier: experimental
timeout: 120
build-timeout: 600
concurrency: 2
sources-path: .
exclude:
  - '**/Tests/**'
  - 'AppTests/'
  - '**/Package.swift'
markdown-output: mutation-summary.md
output: mutation-report.json
mutators:
  - name: RelationalOperatorReplacement
    active: true
  - name: BooleanLiteralReplacement
    active: true
  - name: LogicalOperatorReplacement
    active: true
  - name: ArithmeticOperatorReplacement
    active: true
  - name: NegateConditional
    active: true
  - name: SwapTernary
    active: true
  - name: RemoveSideEffects
    active: true
